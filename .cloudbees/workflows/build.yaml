apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: build-and-deploy

on:
  push:
    branches:
      - main

permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write

jobs:
  build-and-deploy:
    steps:
      - name: Check out source code
        uses: https://github.com/cloudbees-io/checkout@v2

      - name: Scan with njsscan
        id: njsscan-step
        uses: cloudbees-io/njsscan-hybrid-plugin@v1

      - name: Debug — njsscan outputs
        uses: docker://alpine:latest
        shell: sh
        run: |
          echo "critical-count:   ${{ steps.njsscan-step.outputs.critical-count }}"
          echo "very-high-count:  ${{ steps.njsscan-step.outputs.very-high-count }}"
          echo "high-count:       ${{ steps.njsscan-step.outputs.high-count }}"
          echo "medium-count:     ${{ steps.njsscan-step.outputs.medium-count }}"
          echo "low-count:        ${{ steps.njsscan-step.outputs.low-count }}"
          echo "policy-subject:   ${{ steps.njsscan-step.outputs.policy-subject }}"

      - name: Install dependencies and build
        uses: docker://node:20
        shell: sh
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Deploy to Netlify
        uses: docker://node:20
        shell: sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"