apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: build-and-deploy

on:
  push:
    branches:
      - main

permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write

jobs:
  scan-and-evaluate:
    outputs:
      policy-subject: ${{ steps.build-policy-subject.outputs.policy-subject }}
    steps:
      - name: Check out source code
        uses: https://github.com/cloudbees-io/checkout@v2

      - name: Scan with njsscan
        id: njsscan-step
        uses: cloudbees-io/njsscan-hybrid-plugin@v1

      # njsscan-hybrid-plugin@v1 only exposes count outputs (critical-count,
      # very-high-count, high-count, medium-count, low-count) — confirmed via
      # a live 401-style validation error, no policy-subject output exists.
      # So we build the policy-subject object ourselves from those counts.
      #
      # We don't yet know for certain whether the "vulnerability_scan" subject
      # type needs a ".data." wrapper (one confirmed reference policy without
      # it, one confirmed reference policy WITH it for a different subject
      # type, sast_scan_summary). Writing both shapes so either field path
      # resolves to real numbers rather than guessing wrong.
      - id: build-policy-subject
        name: Build policy subject from njsscan counts
        uses: docker://alpine:latest
        shell: sh
        env:
          CRITICAL: ${{ steps.njsscan-step.outputs.critical-count }}
          VERY_HIGH: ${{ steps.njsscan-step.outputs.very-high-count }}
          HIGH: ${{ steps.njsscan-step.outputs.high-count }}
          MEDIUM: ${{ steps.njsscan-step.outputs.medium-count }}
          LOW: ${{ steps.njsscan-step.outputs.low-count }}
        run: |
          cat > "$CLOUDBEES_OUTPUTS/policy-subject" << EOF
          {
            "vulnerability_scan": {
              "summary": {
                "by_severity": {
                  "critical": ${CRITICAL:-0},
                  "very_high": ${VERY_HIGH:-0},
                  "high": ${HIGH:-0},
                  "medium": ${MEDIUM:-0},
                  "low": ${LOW:-0}
                }
              },
              "data": {
                "summary": {
                  "by_severity": {
                    "critical": ${CRITICAL:-0},
                    "very_high": ${VERY_HIGH:-0},
                    "high": ${HIGH:-0},
                    "medium": ${MEDIUM:-0},
                    "low": ${LOW:-0}
                  }
                }
              }
            }
          }
          EOF
          echo "--- policy-subject built ---"
          cat "$CLOUDBEES_OUTPUTS/policy-subject"

  policy-evaluation-within:
    needs: scan-and-evaluate
    uses: cloudbees-io/policy-utils/evaluate-policy-context/workflow.yml@v2
    with:
      input-data: ${{ needs.scan-and-evaluate.outputs.policy-subject }}
      checkpoint-type: workflow
      checkpoint-position: within

  policy-evaluation-exit:
    needs:
      - policy-evaluation-within
      - scan-and-evaluate
    uses: cloudbees-io/policy-utils/evaluate-policy-context/workflow.yml@v2
    with:
      input-data: ${{ needs.scan-and-evaluate.outputs.policy-subject }}
      checkpoint-type: workflow
      checkpoint-position: exit

  build-and-deploy:
    needs: policy-evaluation-exit
    steps:
      - name: Check out source code
        uses: https://github.com/cloudbees-io/checkout@v2

      - name: Install dependencies and build
        uses: docker://node:20
        shell: sh
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Deploy to Netlify
        uses: docker://node:20
        shell: sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"